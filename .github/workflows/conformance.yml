name: Conformance

# Cross-runtime guarantee: for the same asset + viewport + resolver profile,
# native (Rust CLI), WASM (@airovo/rva-node) and the C ABI (rva_ffi) must produce
# byte-identical ResolvedScene JSON. See conformance/run.sh.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-runtime:
    name: native == wasm == c-abi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: npm ci
      - run: bash conformance/run.sh
