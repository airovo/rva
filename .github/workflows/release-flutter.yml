name: Release (pub.dev)

# Publishes the Flutter adapter (adapters/flutter) to pub.dev.
#
# pub.dev automated publishing only accepts TAG-triggered runs, and the OIDC token
# is provisioned by dart-lang/setup-dart (see the reusable workflow below) — a
# plain `flutter pub publish` in a custom workflow falls back to interactive login.
#
# Configure once at https://pub.dev/packages/rva_flutter/admin -> Automated
# publishing: repository `airovo/rva`, tag pattern `rva_flutter-v{{version}}`,
# enable push events. The pubspec `version` must equal the tag's version.
#
# Release: bump adapters/flutter/pubspec.yaml + CHANGELOG, commit, then
#   git tag rva_flutter-vX.Y.Z && git push origin rva_flutter-vX.Y.Z

on:
  push:
    tags:
      - "rva_flutter-v*"

jobs:
  publish:
    name: Publish to pub.dev
    permissions:
      id-token: write # OIDC for pub.dev automated publishing
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: adapters/flutter
