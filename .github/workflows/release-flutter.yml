name: Release (pub.dev)

# Publishes the Flutter adapter (adapters/flutter) to pub.dev.
#
# Auth: pub.dev Automated publishing (OIDC) — configure it once at
#   https://pub.dev/packages/rva_flutter/admin  -> Automated publishing:
#     repository: airovo/rva, workflow: release-flutter.yml
#     enable: workflow_dispatch events only (manual releases)
# The package must already exist (first publish is manual).
# Fallback: set the PUBLISH_TOKEN secret and uncomment NODE... -> see below.

on:
  workflow_dispatch:

concurrency:
  group: release-flutter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: flutter pub publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # pub.dev automated publishing (OIDC)
      contents: read
    defaults:
      run:
        working-directory: adapters/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Publish
        run: flutter pub publish --force
        # For a token fallback instead of OIDC, set the PUBLISH_TOKEN secret and
        # add:  env: { PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }} }
