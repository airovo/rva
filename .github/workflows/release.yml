name: Release (npm)

# Versioning + publishing via Changesets.
#   - On push to main: opens/updates a "Version Packages" PR.
#   - When that PR is merged: publishes changed @airovo/* packages to npm and
#     creates GitHub releases.
#
# Auth: npm Trusted Publishing (OIDC) — no long-lived secret.
# One-time setup, for EACH package on npmjs.com -> Settings -> Trusted Publisher:
#   Provider:            GitHub Actions
#   Organization/user:   airovo
#   Repository:          rva
#   Workflow filename:   release.yml     (must match this file's name)
#   Environment:         (leave empty)
# Provenance is emitted automatically from the id-token permission below.
# If you ever need a fallback, set the NPM_TOKEN secret and add it as
#   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
# to the changesets/action step.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # npm provenance / OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Node 24 ships npm >= 11.5, required for trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run build
      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Do NOT force NPM_CONFIG_PROVENANCE. npm generates provenance
          # automatically for trusted publishing, but only when the source
          # repository is public. Forcing it while the repo is private makes
          # npm sign a bundle the registry rejects (E422). It turns on by itself
          # once the repo is made public.
