[package]
name = "rva-core"
description = "RVA (Responsive Visual Asset) reference core: parse, resolve, render."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["render", "packaging"]
# Reference rasterizer (resvg/tiny-skia) used by the CLI, server and native FFI.
# Resolution itself is font-independent (see fonts.rs); fontdb is only needed to
# draw glyphs with the platform font stack.
render = ["dep:resvg", "dep:usvg", "dep:tiny-skia", "dep:base64", "dep:fontdb"]
# Full image decode/encode for pack-time optimization (PNG -> WebP/JPEG).
packaging = ["dep:image"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
flate2 = "1"
# Header-only image dimension probing: small, pure Rust, no decoders.
imagesize = "0.13"
ts-rs = "10"

image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"], optional = true }
resvg = { version = "0.45", optional = true }
usvg = { version = "0.45", optional = true }
tiny-skia = { version = "0.11", optional = true }
fontdb = { version = "0.23", optional = true }
base64 = { version = "0.22", optional = true }
