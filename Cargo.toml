[workspace]
resolver = "2"
members = ["core", "cli", "wasm", "ffi", "server"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/airovo/rva"
homepage = "https://rva.airovo.tech"
keywords = ["rva", "responsive", "image", "asset", "layout"]
categories = ["graphics", "multimedia::images", "web-programming", "wasm"]

[profile.release]
lto = true
codegen-units = 1
# NOTE: do not set `strip` here — it strips the wasm `target_features` section and
# breaks wasm-opt/binaryen validation. Native FFI builds strip via `--config`
# (see adapters/swift/build-xcframework.sh and scripts/build-native-libs.sh).
