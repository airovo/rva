<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RVA — one asset, any shape</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        background: radial-gradient(1200px 600px at 50% -10%, #eef2ff, #f8fafc 60%);
        color: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
      p { color: #475569; margin: 0; font-size: 14px; max-width: 52ch; }
      code { background: #e2e8f0; padding: 0 4px; border-radius: 4px; }

      .stage { position: relative; width: 100%; max-width: 1100px; }
      rva-image {
        display: block;
        width: 100%;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.15);
        /* Default shape: portrait / phone. The media queries below morph the box,
           and <rva-image> recomposes the asset for the new dimensions. */
        aspect-ratio: 9 / 16;
      }
      @media (min-width: 480px)  { rva-image { aspect-ratio: 1 / 1; } }        /* square   */
      @media (min-width: 820px)  { rva-image { aspect-ratio: 16 / 9; } }       /* desktop  */
      @media (min-width: 1400px) { rva-image { aspect-ratio: 2 / 1; } }        /* wide (2:1) */

      /* CTA region overlay (authoring/inspection aid; not part of the asset). */
      .cta-box {
        position: absolute;
        border: 2px dashed #0d9488;
        background: rgba(13, 148, 136, 0.14);
        border-radius: 6px;
        pointer-events: none;
      }
      .cta-tag {
        position: absolute;
        top: 0;
        left: -2px;
        transform: translateY(-100%);
        background: #0d9488;
        color: #fff;
        font: 600 11px/1 ui-monospace, monospace;
        padding: 4px 6px;
        border-radius: 4px 4px 0 0;
        white-space: nowrap;
      }

      .badge {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #334155;
        background: #eef2ff;
        border: 1px solid #c7d2fe;
        border-radius: 999px;
        padding: 7px 14px;
      }
      .badge b { color: #1e293b; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>RVA — one asset, any shape</h1>
    <p>
      The same asset in a single element. Resize the window: the box changes shape
      and the composition recomposes. Fixture <code>01-basic-hero</code> declares a
      CTA region <code>shop-cta</code> — click the highlighted area.
    </p>

    <div class="stage" id="stage">
      <rva-image id="hero" src="fixtures/01-basic-hero.rva" alt="Responsive campaign hero"></rva-image>
    </div>

    <div class="badge" id="status">resolving…</div>
    <div class="badge" id="cta">no CTA regions</div>

    <script type="importmap">
      { "imports": { "@airovo/rva-web": "../../adapters/web/dist/rva-image.js?v=2" } }
    </script>
    <script type="module">
      import "@airovo/rva-web";

      const hero = document.getElementById("hero");
      const stage = document.getElementById("stage");
      const status = document.getElementById("status");
      const ctaBadge = document.getElementById("cta");

      // Guard against a stale cached adapter build (pre-callback API).
      if (!("onCta" in hero)) {
        status.textContent = "stale @airovo/rva-web build — hard reload (⌘⇧R)";
      }

      let hits = 0;
      let last = null;

      const renderCta = () => {
        ctaBadge.textContent =
          `CTA ${last ? `· last activation: ${last}` : ""}${hits ? ` · shop-cta fired ${hits}×` : ""}`;
      };

      // Callback style — the same sugar the React wrapper exposes as props.
      hero.onRender = (scene) => {
        const degraded = scene.degraded ? " · <b>degraded</b>" : "";
        status.innerHTML =
          `topology <b>${scene.topology}</b> · ${scene.width}×${scene.height} · ` +
          `viability <b>${scene.viability.toFixed(2)}</b>${degraded}`;
      };

      hero.onCtaRegions = (regions) => {
        stage.querySelectorAll(".cta-box").forEach((node) => node.remove());
        const visible = regions.filter((region) => region.visible);
        ctaBadge.textContent = visible.length
          ? `CTA ${visible.map((region) => region.id).join(", ")}`
          : "no CTA regions";
        for (const region of visible) {
          const box = document.createElement("div");
          box.className = "cta-box";
          box.style.left = `${region.normalizedBounds.x * 100}%`;
          box.style.top = `${region.normalizedBounds.y * 100}%`;
          box.style.width = `${region.normalizedBounds.width * 100}%`;
          box.style.height = `${region.normalizedBounds.height * 100}%`;
          box.innerHTML = `<span class="cta-tag">${region.id}</span>`;
          stage.appendChild(box);
        }
      };

      hero.onCta = (cta) => {
        last = cta.id;
        renderCta();
      };

      hero.ctaHandlers = {
        "shop-cta": () => {
          hits += 1;
          renderCta();
          // The host decides what activation means, e.g.:
          //   location.assign("/product/42");
        },
      };

      hero.onError = (detail) => {
        status.textContent = "render error — see console";
        console.error(detail);
      };

      // Event style works too (and is what the callbacks are sugar over):
      // hero.addEventListener("rva-render", (e) => console.log(e.detail.topology));
    </script>
  </body>
</html>
